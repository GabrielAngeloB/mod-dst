name: Lua syntax validation

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
  workflow_dispatch:

jobs:
  lua-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Parse every Lua source file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            luac5.1 -p "$file"
          done < <(find . -type f -name '*.lua' -not -path './.git/*' -print0)
